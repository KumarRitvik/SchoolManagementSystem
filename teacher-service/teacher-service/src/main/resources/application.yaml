server:
  port: 8082

spring:
  application:
    name: TEACHER-SERVICE

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dev_school_teacher_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

file:
  upload-dir: uploads/teachers