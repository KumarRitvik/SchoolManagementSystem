<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teachers</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
    <a href="/teacher-page/viewAll">Teachers</a>
    <a href="/teacher-page/create">Create Teacher</a>
    <a href="/teacher-student-page">Students</a>
    <a href="/assignment-page">Assignments</a>
</nav>

<main>
    <h1>Teachers</h1>

    <form method="get" action="/teacher-page/search">
        <input type="text"
               name="name"
               placeholder="Search teacher by name"
               th:value="${searchName}">
        <input type="hidden" name="page" value="0">
        <input type="hidden" name="size" value="10">
        <input type="hidden" name="sortBy" value="teacherId">
        <input type="hidden" name="direction" value="asc">
        <button type="submit">Search</button>
    </form>

    <form method="get" action="/teacher-page/searchByType">
        <select name="teacherType" required>
            <option value="">Select teacher type</option>
            <option th:each="type : ${teacherTypes}"
                    th:value="${type}"
                    th:text="${type}"
                    th:selected="${selectedTeacherType != null && selectedTeacherType == type}">
            </option>
        </select>
        <button type="submit">Search by Type</button>
    </form>

    <p>
        <a class="button" href="/teacher-page/create">+ Create Teacher</a>
    </p>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Photo</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Type</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="teacher : ${teachers.content}">
            <td th:text="${teacher.teacherId}"></td>
            <td>
                <img class="thumb"
                     th:src="@{/teacher-page/{id}/photo(id=${teacher.teacherId})}"
                     alt="Teacher photo">
            </td>
            <td th:text="${teacher.name}"></td>
            <td th:text="${teacher.email}"></td>
            <td th:text="${teacher.phoneNumber}"></td>
            <td th:text="${teacher.teacherType}"></td>
            <td th:text="${teacher.salary}"></td>
            <td>
                <a th:href="@{/teacher-page/view/{id}(id=${teacher.teacherId})}">View</a>
                |
                <a th:href="@{/teacher-page/edit/{id}(id=${teacher.teacherId})}">Edit</a>
                |
                <a th:href="@{/teacher-page/delete/{id}(id=${teacher.teacherId})}"
                   onclick="return confirm('Delete this teacher?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${teachers != null}">
        <a th:if="${page > 0}"
           th:href="@{/teacher-page/viewAll(page=${page-1},size=${size},sortBy=${sortBy},direction=${direction})}">
            Previous
        </a>

        <span>
            Page <strong th:text="${page + 1}"></strong>
            of
            <strong th:text="${teachers.totalPages}"></strong>
        </span>

        <a th:if="${page + 1 < teachers.totalPages}"
           th:href="@{/teacher-page/viewAll(page=${page+1},size=${size},sortBy=${sortBy},direction=${direction})}">
            Next
        </a>
    </div>
</main>

</body>
</html>
