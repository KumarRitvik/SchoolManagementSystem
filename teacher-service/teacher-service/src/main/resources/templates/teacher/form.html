<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Teacher Form</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/teacher-page">Teachers</a></nav><main><h1 th:text="${teacher.teacherId == null ? 'Create Teacher' : 'Update Teacher'}"></h1><form th:action="${teacher.teacherId == null ? '/teacher-page/create' : '/teacher-page/update'}" method="post" th:object="${teacher}"><input type="hidden" th:field="*{teacherId}"><label>Name</label><input th:field="*{name}" required><label>Email</label><input type="email" th:field="*{email}" required><label>Phone</label><input th:field="*{phoneNumber}" required><label>Teacher Type</label><select th:field="*{teacherType}" required><option value="">Select</option><option th:each="t:${teacherTypes}" th:value="${t}" th:text="${t}"></option></select><label>Salary</label><input type="number" step="0.01" th:field="*{salary}" required><label>Photo value</label><input th:field="*{photo}" required><button>Save</button></form></main></body></html>
