<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Assignments</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/teacher-page">Teachers</a><a href="/assignment-page">Assignments</a><a href="/assignment-page/create">Create Assignment</a></nav><main><h1>Assignments</h1><table><tr><th>ID</th><th>Academic Year</th><th>Active</th><th>Teacher</th><th>Subject</th><th>Class</th><th>Actions</th></tr><tr th:each="a:${assignments.content}"><td th:text="${a.assignmentId}"></td><td th:text="${a.academicYear}"></td><td th:text="${a.active}"></td><td th:text="${a.teacherId}"></td><td th:text="${a.subjectId}"></td><td th:text="${a.classId}"></td><td><a class="button" th:href="@{/assignment-page/view/{id}(id=${a.assignmentId})}">View</a><a class="button" th:href="@{/assignment-page/edit/{id}(id=${a.assignmentId})}">Edit</a><a class="button danger" th:href="@{/assignment-page/delete/{id}(id=${a.assignmentId})}" onclick="return confirm('Delete?')">Delete</a></td></tr></table><div class="pagination"><a class="button" th:if="${page>0}" th:href="@{/assignment-page(page=${page-1},size=${size})}">Previous</a><span th:text="'Page '+(${page+1})+' of '+${assignments.totalPages}"></span><a class="button" th:if="${page+1<assignments.totalPages}" th:href="@{/assignment-page(page=${page+1},size=${size})}">Next</a></div></main></body></html>
