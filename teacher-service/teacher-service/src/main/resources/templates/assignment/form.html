<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Assignment</title><link rel="stylesheet" href="/style.css"></head><body><main><h1 th:text="${assignment.assignmentId == null ? 'Create Assignment' : 'Update Assignment'}"></h1><form th:action="${assignment.assignmentId == null ? '/assignment-page/create' : '/assignment-page/update'}" method="post" th:object="${assignment}"><input type="hidden" th:field="*{assignmentId}"><label>Academic Year</label><input type="number" th:field="*{academicYear}" required><label>Active</label><select th:field="*{active}"><option value="true">true</option><option value="false">false</option></select><label>Teacher ID</label><input type="number" th:field="*{teacherId}" required><label>Subject ID</label><input type="number" th:field="*{subjectId}" required><label>Class ID</label><input type="number" th:field="*{classId}" required><button>Save</button></form></main></body></html>
