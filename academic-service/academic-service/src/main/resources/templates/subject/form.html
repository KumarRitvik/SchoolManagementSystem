<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Subject Form</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/subject-page">Subjects</a></nav><main><h1 th:text="${subject.subjectId == null ? 'Create Subject' : 'Update Subject'}"></h1><form th:action="${subject.subjectId == null ? '/subject-page/create' : '/subject-page/update'}" method="post" th:object="${subject}"><input type="hidden" th:field="*{subjectId}"><label>Subject Name</label><select th:field="*{subjectName}" required><option value="">Select</option><option th:each="s:${subjectTypes}" th:value="${s}" th:text="${s}"></option></select><label>Subject Code</label><input th:field="*{subjectCode}" placeholder="ABC123" required><label>Theory Marks</label><input type="number" th:field="*{theoryMarks}" min="0" max="80"><label>Practical Marks</label><input type="number" th:field="*{practicalMarks}" min="0" max="20"><button>Save</button></form></main></body></html>
