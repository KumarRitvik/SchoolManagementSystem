<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Subjects</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/subject-page">Subjects</a><a href="/classroom-page">Classrooms</a><a href="/subject-page/create">Create Subject</a></nav><main><h1>Subjects</h1><table><tr><th>ID</th><th>Name</th><th>Code</th><th>Theory</th><th>Practical</th><th>Actions</th></tr><tr th:each="s:${subjects.content}"><td th:text="${s.subjectId}"></td><td th:text="${s.subjectName}"></td><td th:text="${s.subjectCode}"></td><td th:text="${s.theoryMarks}"></td><td th:text="${s.practicalMarks}"></td><td><a class="button" th:href="@{/subject-page/view/{id}(id=${s.subjectId})}">View</a><a class="button" th:href="@{/subject-page/edit/{id}(id=${s.subjectId})}">Edit</a><a class="button danger" th:href="@{/subject-page/delete/{id}(id=${s.subjectId})}" onclick="return confirm('Delete?')">Delete</a></td></tr></table><div class="pagination"><a class="button" th:if="${page>0}" th:href="@{/subject-page(page=${page-1},size=${size})}">Previous</a><span th:text="'Page '+(${page+1})+' of '+${subjects.totalPages}"></span><a class="button" th:if="${page+1<subjects.totalPages}" th:href="@{/subject-page(page=${page+1},size=${size})}">Next</a></div></main></body></html>
