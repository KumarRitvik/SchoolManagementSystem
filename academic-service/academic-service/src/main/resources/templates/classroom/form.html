<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Classroom Form</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/classroom-page">Classrooms</a></nav><main><h1 th:text="${classroom.clasRoomId == null ? 'Create Classroom' : 'Update Classroom'}"></h1><form th:action="${classroom.clasRoomId == null ? '/classroom-page/create' : '/classroom-page/update'}" method="post" th:object="${classroom}"><input type="hidden" th:field="*{clasRoomId}"><label>Standard</label><select th:field="*{standard}" required><option value="">Select</option><option th:each="s:${standards}" th:value="${s}" th:text="${s}"></option></select><label>Section</label><select th:field="*{section}" required><option value="">Select</option><option th:each="s:${sections}" th:value="${s}" th:text="${s}"></option></select><label>Academic Year</label><input th:field="*{academicYear}" required><label>Capacity</label><input type="number" th:field="*{capacity}" min="3" max="50" required><button>Save</button></form></main></body></html>
