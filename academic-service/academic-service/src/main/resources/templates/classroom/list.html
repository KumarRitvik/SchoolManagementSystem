<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Classrooms</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/subject-page">Subjects</a><a href="/classroom-page">Classrooms</a><a href="/classroom-page/create">Create Classroom</a></nav><main><h1>Classrooms</h1><table><tr><th>ID</th><th>Standard</th><th>Section</th><th>Academic Year</th><th>Capacity</th><th>Actions</th></tr><tr th:each="c:${classrooms.content}"><td th:text="${c.clasRoomId}"></td><td th:text="${c.standard}"></td><td th:text="${c.section}"></td><td th:text="${c.academicYear}"></td><td th:text="${c.capacity}"></td><td><a class="button" th:href="@{/classroom-page/view/{id}(id=${c.clasRoomId})}">View</a><a class="button" th:href="@{/classroom-page/edit/{id}(id=${c.clasRoomId})}">Edit</a><a class="button danger" th:href="@{/classroom-page/delete/{id}(id=${c.clasRoomId})}" onclick="return confirm('Delete?')">Delete</a></td></tr></table><div class="pagination"><a class="button" th:if="${page>0}" th:href="@{/classroom-page(page=${page-1},size=${size})}">Previous</a><span th:text="'Page '+(${page+1})+' of '+${classrooms.totalPages}"></span><a class="button" th:if="${page+1<classrooms.totalPages}" th:href="@{/classroom-page(page=${page+1},size=${size})}">Next</a></div></main></body></html>
