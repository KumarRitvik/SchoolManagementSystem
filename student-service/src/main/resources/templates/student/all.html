<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>All Students</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/student-page">Students</a><a href="/student-page/create">Create</a></nav><main><h1>All Students</h1><table><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Type</th><th>Action</th></tr><tr th:each="s:${students}"><td th:text="${s.studentId}"></td><td th:text="${s.name}"></td><td th:text="${s.email}"></td><td th:text="${s.phoneNumber}"></td><td th:text="${s.studentType}"></td><td><a class="button" th:href="@{/student-page/view/{id}(id=${s.studentId})}">View</a></td></tr></table></main></body></html>
