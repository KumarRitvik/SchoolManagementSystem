<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Teacher</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/student-page">Students</a></nav><main><h1>Teacher Lookup</h1><div class="card"><p><b>ID:</b> <span th:text="${teacher.teacherId}"></span></p><p><b>Name:</b> <span th:text="${teacher.name}"></span></p><p><b>Email:</b> <span th:text="${teacher.email}"></span></p><p><b>Phone:</b> <span th:text="${teacher.phoneNumber}"></span></p><p><b>Type:</b> <span th:text="${teacher.teacherType}"></span></p><img class="photo" th:src="@{/student-page/teacher/{id}/photo(id=${teacher.teacherId})}"></div></main></body></html>
