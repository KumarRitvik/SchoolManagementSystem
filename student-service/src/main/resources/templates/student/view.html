<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Student</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/student-page">Students</a></nav><main><h1>Student Details</h1><div class="card"><img class="photo" th:src="@{/student-page/{id}/photo(id=${student.studentId})}"><p><b>ID:</b> <span th:text="${student.studentId}"></span></p><p><b>Name:</b> <span th:text="${student.name}"></span></p><p><b>Email:</b> <span th:text="${student.email}"></span></p><p><b>Phone:</b> <span th:text="${student.phoneNumber}"></span></p><p><b>Gender:</b> <span th:text="${student.gender}"></span></p><p><b>DOB:</b> <span th:text="${student.dateOfBirth}"></span></p><p><b>Address:</b> <span th:text="${student.address}"></span></p><p><b>Guardian:</b> <span th:text="${student.guardianName}"></span></p><p><b>Guardian Phone:</b> <span th:text="${student.guardianPhoneNumber}"></span></p><p><b>Type:</b> <span th:text="${student.studentType}"></span></p><p><b>Fees:</b> <span th:text="${student.totalCalculatedFees}"></span></p></div>
<form th:action="@{/student-page/{id}/photo(id=${student.studentId})}" method="post" enctype="multipart/form-data"><label>Upload Photo</label><input type="file" name="photo" required><button>Upload</button></form>
<a class="button" th:href="@{/student-page/{id}/photo/delete(id=${student.studentId})}">Delete Photo</a><a class="button" th:href="@{/student-page/edit/{id}(id=${student.studentId})}">Edit</a></main></body></html>
