<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Enrollment Form</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/enrollment-page">Enrollments</a></nav><main><h1 th:text="${enrollment.enrollmentId == null ? 'Create Enrollment' : 'Update Enrollment'}"></h1><form th:action="${enrollment.enrollmentId == null ? '/enrollment-page/create' : '/enrollment-page/update'}" method="post" th:object="${enrollment}"><input type="hidden" th:field="*{enrollmentId}"><label>Student ID</label><input type="number" th:field="*{studentId}" required><label>Subject ID</label><input type="number" th:field="*{subjectId}" required><label>Class ID</label><input type="number" th:field="*{classId}" required><label>Session Year</label><input type="number" th:field="*{sessionYear}" required><label>Active</label><select th:field="*{active}"><option value="true">true</option><option value="false">false</option></select><label>Theory Marks</label><input type="number" th:field="*{scoredTheoryMarks}"><label>Practice Marks</label><input type="number" th:field="*{scoredPracticeMarks}"><button>Save</button></form></main></body></html>
