<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Enrollments</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/student-page">Students</a><a href="/enrollment-page">Enrollments</a><a href="/enrollment-page/create">Create Enrollment</a></nav><main><h1>Enrollments</h1><table><tr><th>ID</th><th>Student</th><th>Subject</th><th>Class</th><th>Year</th><th>Active</th><th>Theory</th><th>Practical</th><th>Actions</th></tr><tr th:each="e:${enrollments.content}"><td th:text="${e.enrollmentId}"></td><td th:text="${e.studentId}"></td><td th:text="${e.subjectId}"></td><td th:text="${e.classId}"></td><td th:text="${e.sessionYear}"></td><td th:text="${e.active}"></td><td th:text="${e.scoredTheoryMarks}"></td><td th:text="${e.scoredPracticeMarks}"></td><td><a class="button" th:href="@{/enrollment-page/view/{id}(id=${e.enrollmentId})}">View</a><a class="button" th:href="@{/enrollment-page/edit/{id}(id=${e.enrollmentId})}">Edit</a><a class="button danger" th:href="@{/enrollment-page/delete/{id}(id=${e.enrollmentId})}" onclick="return confirm('Delete?')">Delete</a></td></tr></table>
<div class="pagination"><a class="button" th:if="${page>0}" th:href="@{/enrollment-page(page=${page-1},size=${size})}">Previous</a><span th:text="'Page '+(${page+1})+' of '+${enrollments.totalPages}"></span><a class="button" th:if="${page+1<enrollments.totalPages}" th:href="@{/enrollment-page(page=${page+1},size=${size})}">Next</a></div></main></body></html>
